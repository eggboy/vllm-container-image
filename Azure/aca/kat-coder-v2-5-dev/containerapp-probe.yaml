# =============================================================================
# containerapp-probe.yaml — Startup probe config for KAT-Coder-V2.5-Dev on ACA GPU
#
# Why custom probes?
#   Azure Container Apps does NOT add default probes for GPU workload profiles.
#   Without an explicit startup probe, the platform may kill the container before
#   the model finishes loading (~5-15 min for the 35B-A3B MoE: ~24 GB AWQ-INT4
#   weight load + Marlin repacking + torch.compile / CUDA graph capture for the
#   hybrid Gated DeltaNet backend).
#
# Startup budget calculation:
#   initialDelaySeconds (60) + failureThreshold (60) × periodSeconds (20) = 1260s
#   This gives the container up to ~21 minutes to start serving /health (same
#   budget as the Qwen3.8-27B app; the first start on a new vLLM release
#   compiles from a cold cache).
#   NOTE: ACA constrains initialDelaySeconds to the range [0, 60]. To extend the
#   startup window further, increase periodSeconds (max 240) or failureThreshold,
#   NOT initialDelaySeconds.
#
# vLLM /health endpoint returns 200 only after the model is fully loaded and
# ready to serve requests.
# =============================================================================
properties:
  template:
    containers:
      - name: kat-coder-v2-5-dev
        image: crjay.azurecr.io/kat-coder-v2-5-dev-vllm:latest
        resources:
          cpu: 24
          memory: 220Gi
        probes:
          - type: Startup
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 15
            failureThreshold: 60
          - type: Liveness
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          - type: Readiness
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
